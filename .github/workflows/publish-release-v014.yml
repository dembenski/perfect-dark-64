# Publish Perfect Dark 64 v0.1.4 release (temporary — DELETE after the release is live)
name: Publish Perfect Dark 64 v0.1.4 release (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: dembenski/perfect-dark-64
        run: |
          gh api repos/dembenski/perfect-dark-64/actions/runs/42642580781/artifacts --jq '.artifacts[] | "\(.id) \(.name) expired=\(.expired)"'
          ARTIFACT_ID=$(gh api repos/dembenski/perfect-dark-64/actions/runs/42642580781/artifacts --jq '.artifacts[] | select(.name=="sm64coopdx-windows") | .id')
          test -n "$ARTIFACT_ID"
          echo "Artifact ID: $ARTIFACT_ID"
          gh api repos/dembenski/perfect-dark-64/actions/artifacts/${ARTIFACT_ID}/zip > artifact.zip
          ls -lh artifact.zip
          mkdir -p artifact
          unzip -o artifact.zip -d artifact
          ls -lhR artifact
      - name: Repack release zip (flat — game files directly inside)
        run: |
          ls -lh artifact/
          mkdir -p game
          unzip -o artifact/sm64coopdx_Windows.zip -d game
          ls game/ | head
          test -f game/sm64coopdx.exe
          test -d game/mods/perfect-dark-64
          cd game
          zip -r ../sm64coopdx-windows.zip .
          cd ..
          ls -lh sm64coopdx-windows.zip
          unzip -l sm64coopdx-windows.zip | grep -E "sm64coopdx.exe|perfect-dark-64" | head -5
      - name: Create and publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.4
          target_commitish: main
          name: Perfect Dark 64 v0.1.4
          body: |
            Perfect Dark 64 v0.1.4 — Perfect Dark characters and weapons in Mario 64, on PC (sm64coopdx Lua mod).

            NEW IN v0.1.4:
            - Falcon 2 gun model — the Falcon 2 now has its own 3D gun model.
            - Blocky Joanna player model — Joanna Dark now has a blocky 3D player model.

            BRING YOUR OWN SM64 ROM — no games are included. Unzip once, then run sm64coopdx.exe --backend directx (fixes "fragment shader compilation failed" on old Intel GPUs). The game asks for your own SM64 ROM on first launch. The zip is flat — unzip once and the game files are directly inside.

            Unofficial fan project, not affiliated with Nintendo, Rare, or Microsoft.
          files: sm64coopdx-windows.zip
          draft: false
          prerelease: false
