name: Temp publish v0.1.0-falcon2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_REPO: dembenski/perfect-dark-64
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download Windows artifact zip via Actions API
        run: |
          set -euxo pipefail
          ARTIFACT_ID=$(gh api "repos/dembenski/perfect-dark-64/actions/runs/42400317751/artifacts" --jq '.artifacts[] | select(.name=="sm64coopdx-windows") | .id')
          echo "ARTIFACT_ID=${ARTIFACT_ID}"
          test -n "${ARTIFACT_ID}"
          curl -L -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/dembenski/perfect-dark-64/actions/artifacts/${ARTIFACT_ID}/zip" -o sm64coopdx-windows.zip
          ls -lh sm64coopdx-windows.zip
          if unzip -t sm64coopdx-windows.zip >/dev/null 2>&1; then
            echo "Artifact zip OK"
            unzip -l sm64coopdx-windows.zip | head -n 50
          else
            echo "API zip download failed, falling back to gh run download"
            rm -f sm64coopdx-windows.zip
            gh run download 42400317751 --name sm64coopdx-windows --dir sm64coopdx-windows
            ls -lh sm64coopdx-windows
            (cd sm64coopdx-windows && zip -r ../sm64coopdx-windows.zip .)
            ls -lh sm64coopdx-windows.zip
          fi
      - name: Upload zip to draft release and publish it
        run: |
          set -euxo pipefail
          gh release view v0.1.0-falcon2
          gh release upload v0.1.0-falcon2 sm64coopdx-windows.zip --clobber
          gh release edit v0.1.0-falcon2 --draft=false
          gh release view v0.1.0-falcon2
