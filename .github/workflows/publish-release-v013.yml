# Publish Perfect Dark 64 v0.1.3 release (temporary — DELETE after the release is live)
name: Publish Perfect Dark 64 v0.1.3 release (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: dembenski/perfect-dark-64
        run: |
          gh api repos/dembenski/perfect-dark-64/actions/runs/42631077585/artifacts --jq '.artifacts[] | "\(.id) \(.name) expired=\(.expired)"'
          ARTIFACT_ID=$(gh api repos/dembenski/perfect-dark-64/actions/runs/42631077585/artifacts --jq '.artifacts[] | select(.name=="sm64coopdx-windows") | .id')
          test -n "$ARTIFACT_ID"
          echo "Artifact ID: $ARTIFACT_ID"
          gh api repos/dembenski/perfect-dark-64/actions/artifacts/${ARTIFACT_ID}/zip > artifact.zip
          ls -lh artifact.zip
          mkdir -p artifact
          unzip -o artifact.zip -d artifact
          ls -lhR artifact
      - name: Repack release zip (flat — game files directly inside)
        run: |
          ls -lh artifact/
          mkdir -p game
          unzip -o artifact/sm64coopdx_Windows.zip -d game
          ls game/ | head
          test -f game/sm64coopdx.exe
          test -d game/mods/perfect-dark-64
          cd game
          zip -r ../sm64coopdx-windows.zip .
          cd ..
          ls -lh sm64coopdx-windows.zip
          unzip -l sm64coopdx-windows.zip | grep -E "sm64coopdx.exe|perfect-dark-64" | head -5
      - name: Create and publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.3
          target_commitish: main
          name: Perfect Dark 64 v0.1.3
          body: |
            Perfect Dark 64 v0.1.3 — Perfect Dark characters and weapons in Mario 64, on PC (sm64coopdx Lua mod).

            FIXED IN v0.1.3:
            - Aimed shots flew exactly 180 degrees backwards, behind Mario — the fire ray now uses the first-person camera yaw minus 0x8000 and negated pitch, matching where the camera actually looks.
            - Look-up / look-down with the C-buttons / D-pad were inverted — swapped so up looks up and down looks down.
            - Weapons with reloadTime 0 (Combat Knife, Laser, Grenade, mines, N-Bomb) could never reload — now reload in 1 frame.
            - Pool-less weapons (Combat Knife, Laser) can now reload from nothing.
            - Unarmed can now punch (it has magSize 0 and could never fire).

            BRING YOUR OWN SM64 ROM — no games are included. Unzip once, then run sm64coopdx.exe --backend directx (fixes "fragment shader compilation failed" on old Intel GPUs). The game asks for your own SM64 ROM on first launch. The zip is flat — unzip once and the game files are directly inside.

            Unofficial fan project, not affiliated with Nintendo, Rare, or Microsoft.
          files: sm64coopdx-windows.zip
          draft: false
          prerelease: false
